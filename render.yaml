services:
  - type: web
    name: ai-workforce-api
    runtime: node
    plan: starter
    buildCommand: NODE_ENV=development corepack enable && corepack prepare pnpm@9.0.0 --activate && pnpm install --frozen-lockfile --prod=false && pnpm db:generate && pnpm --filter @ai-workforce/api build
    preDeployCommand: pnpm exec prisma migrate deploy --schema=./prisma/schema.prisma && pnpm db:seed
    startCommand: pnpm --filter @ai-workforce/api start
    disk:
      name: ai-workforce-api-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=4096
      - key: HTTPS
        value: "false"
      - key: FRONTEND_URL
        value: https://ai-workforce-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: ai-workforce-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: GENERATED_DOCS_DIR
        value: /var/data/generated-docs
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DEFAULT_AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: true
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-3-5-sonnet-20241022
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-pro
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai-workforce-redis
          property: connectionString
      - key: SMTP_HOST
        value: smtp.office365.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        value: AI Workforce OS
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false

  - type: web
    name: ai-workforce-web
    runtime: node
    plan: starter
    buildCommand: NODE_ENV=development corepack enable && corepack prepare pnpm@9.0.0 --activate && pnpm install --frozen-lockfile --prod=false && pnpm exec turbo run build --filter=@ai-workforce/web
    startCommand: pnpm --filter @ai-workforce/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://ai-workforce-api.onrender.com/api/v1

  - type: keyvalue
    name: ai-workforce-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: ai-workforce-db
    plan: basic-1gb
